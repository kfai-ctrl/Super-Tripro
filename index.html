<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Tripro - Smart Hydroponics 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #a5d8ff;
            --primary-pink: #ffdce8;
            --accent-purple: #e5dbff;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-main: #5a5a7a;
            --radius: 28px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            background: linear-gradient(180deg, #e0f2ff 0%, #d8f9ff 50%, #ffddec 100%);
            padding: 20px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }

        .wrapper { width: 100%; max-width: 900px; }

        /* Header & Badges */
        .header { text-align: center; margin-bottom: 30px; }
        .header img { height: 80px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1)); }
        .header h1 { font-size: 2.5em; font-weight: 900; color: #5a5a7a; margin-top: 10px; }

        .status-badge { position: fixed; top: 15px; right: 15px; display: flex; flex-direction: column; gap: 6px; z-index: 100; }
        .s-badge { background: white; padding: 6px 16px; border-radius: 20px; font-size: 11px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .s-badge.online { color: #22c55e; border: 1px solid #22c55e; }

        /* Layout Cards */
        .card {
            background: var(--card-bg); backdrop-filter: blur(12px); border-radius: var(--radius);
            padding: 24px; border: 2px solid white; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 22px;
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

        /* Forms & Buttons */
        label { display: block; font-size: 11px; font-weight: 800; margin: 8px 0 4px 4px; color: #888; }
        input { width: 100%; padding: 12px 16px; border: 1px solid #eee; border-radius: 14px; background: rgba(255,255,255,0.9); font-size: 14px; margin-bottom: 10px; }
        
        .btn { border: none; padding: 14px; border-radius: 18px; font-weight: 800; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn-fb { background: #8ba8cc; color: white; }
        .btn-ble { background: #ffc2d4; color: white; }
        .btn-dark { background: #5a5a7a; color: white; margin-top: 10px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

        /* System Mode */
        .mode-container { display: flex; justify-content: space-between; align-items: center; }
        .mode-btn { padding: 12px 25px; border-radius: 15px; border: none; font-weight: 800; cursor: pointer; transition: 0.3s; }
        .mode-btn.active { background: #b8e2f2; color: #4a90e2; }
        .mode-btn.inactive { background: white; color: #ccc; }

        /* Sensors */
        .sensor-val { font-size: 3em; font-weight: 900; font-family: 'Space Mono', monospace; margin: 10px 0; color: #5a5a7a; }
        .sensor-unit { font-size: 0.4em; margin-left: 5px; }

        /* Actuator */
        .actuator-card { text-align: center; background: var(--accent-purple); color: white; }
        .icon-relay { font-size: 5em; margin: 10px 0; transition: 0.5s; }
        .relay-buttons { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
        .relay-buttons button { width: 100px; }

        /* Terminal */
        .terminal { background: #f2e5f5; border-radius: var(--radius); padding: 22px; }
        .log-panel { 
            height: 150px; overflow-y: auto; font-size: 12px; font-family: 'Space Mono', monospace;
            background: rgba(255,255,255,0.5); padding: 15px; border-radius: 16px; margin-top: 10px; color: #7b1fa2;
        }
    </style>
</head>
<body>

<div class="status-badge">
    <div class="s-badge" id="status-bt">BT Offline</div>
    <div class="s-badge" id="status-fb">FB Offline</div>
</div>

<div class="wrapper">
    <div class="header">
        <img src="https://static.wikia.nocookie.net/growagarden/images/c/c3/Applefruiticon.png" alt="Icon">
        <h1>Super Tripro</h1>
    </div>

    <div class="grid-2">
        <div class="card">
            <div style="font-weight: 800; margin-bottom:15px;"><i class="fas fa-cloud"></i> Firebase Sync</div>
            <label>API KEY</label>
            <input type="password" id="fb-apiKey" placeholder="Masukkan API Key">
            <label>DATABASE URL</label>
            <input type="text" id="fb-dbUrl" placeholder="https://...firebaseio.com">
            <label>NODE PATH</label>
            <input type="text" id="fb-path" value="smarthome/ruangan1">
            <button class="btn btn-fb" id="btn-connect-fb">Connect Firebase</button>
        </div>

        <div class="card">
            <div style="font-weight: 800; margin-bottom:15px;"><i class="fab fa-bluetooth-b"></i> Micro:Bit BLE</div>
            <p style="font-size: 12px; color: #888; margin-bottom: 20px;">Aktifkan Bluetooth UART pada Micro:bit melalui MakeCode.</p>
            <button class="btn btn-ble" id="btn-connect-ble">Connect Micro:Bit</button>
            <button class="btn btn-dark" id="btn-disconnect-ble" style="display:none;">Disconnect</button>
        </div>
    </div>

    <div class="card mode-container">
        <div>
            <h3 style="font-weight: 900;">System Mode</h3>
            <p style="font-size: 11px; color: #888;">Pilih kontrol otomatis atau manual</p>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="mode-btn active" id="mode-auto">AUTO</button>
            <button class="mode-btn inactive" id="mode-manual">MANUAL</button>
        </div>
    </div>

    <div class="grid-2">
        <div class="card">
            <div style="font-weight: 800;"><i class="fas fa-tint"></i> Ultrasonic 1 (P0/P1)</div>
            <div class="sensor-val" id="val-jarak">--<span class="sensor-unit">cm</span></div>
            <div style="height: 60px;"><canvas id="chart-jarak"></canvas></div>
        </div>
        <div class="card">
            <div style="font-weight: 800;"><i class="fas fa-water"></i> Ultrasonic 2 (Ember)</div>
            <div class="sensor-val" id="val-jarak-manual" style="color:#8ba8cc;">--<span class="sensor-unit">cm</span></div>
            <div style="height: 60px;"><canvas id="chart-jarak-manual"></canvas></div>
        </div>
    </div>

    <div class="card actuator-card">
        <div style="font-weight: 800; color: #7b1fa2;"><i class="fas fa-bolt"></i> Pompa P13</div>
        <div class="icon-relay" id="icon-relay"><i class="fas fa-plug"></i></div>
        <div id="lbl-relay" style="font-size: 2em; font-weight: 900;">OFF</div>
        
        <div class="relay-buttons" id="manual-relay-control" style="display: none;">
            <button class="btn btn-fb" onclick="manualRelay(1)">ON</button>
            <button class="btn btn-dark" onclick="manualRelay(0)">OFF</button>
        </div>
    </div>

    <div class="terminal">
        <div style="display:flex; justify-content:space-between; font-weight: 800; font-size: 13px;">
            <span><i class="fas fa-terminal"></i> system_terminal: supertripro</span>
            <button id="btnClearLog" style="background:none; border:none; color:#7b1fa2; cursor:pointer; font-weight:bold;">Clear</button>
        </div>
        <div id="terminalLog" class="log-panel"></div>
    </div>
</div>

<script type="module">
import { initializeApp, getApps, deleteApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getDatabase, ref, onValue, update } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const SVC = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX  = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
const TX  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

const S = {
    db: null, fbPath: "smarthome/ruangan1",
    device: null, rxChar: null, bleBuffer: '',
    mode: 'auto', relay: false, charts: {}
};

const $ = id => document.getElementById(id);

function log(msg, color = "#7b1fa2") {
    const t = new Date().toLocaleTimeString('id-ID', { hour12: false });
    const term = $('terminalLog');
    term.insertAdjacentHTML('afterbegin', `<div style="color:${color}">[${t}] ${msg}</div>`);
}

function initCharts() {
    const cfg = color => ({
        type: 'line', data: { labels: [], datasets: [{ data: [], borderColor: color, tension: 0.4, borderWidth: 2, pointRadius: 0 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } }}
    });
    S.charts.jarak = new Chart($('chart-jarak'), cfg('#ffc2d4'));
    S.charts.jarak_manual = new Chart($('chart-jarak-manual'), cfg('#8ba8cc'));
}

function pushToChart(key, val) {
    const chart = S.charts[key];
    if (!chart) return;
    chart.data.labels.push('');
    chart.data.datasets[0].data.push(parseFloat(val));
    if (chart.data.labels.length > 20) { chart.data.labels.shift(); chart.data.datasets[0].data.shift(); }
    chart.update('none');
}

function updateModeUI() {
    const isAuto = S.mode === 'auto';
    $('mode-auto').className = `mode-btn ${isAuto ? 'active' : 'inactive'}`;
    $('mode-manual').className = `mode-btn ${!isAuto ? 'active' : 'inactive'}`;
    $('manual-relay-control').style.display = isAuto ? 'none' : 'flex';
}

function updateRelayUI(isOn) {
    S.relay = isOn;
    $('lbl-relay').textContent = isOn ? 'ON ✓' : 'OFF';
    $('icon-relay').style.color = isOn ? '#fff33b' : '#fff';
    document.querySelector('.actuator-card').style.background = isOn ? '#ffd54f' : '#e5dbff';
}

window.manualRelay = (val) => {
    if (S.mode !== 'manual') return alert("Pindah ke mode MANUAL dahulu!");
    sendBLE('Relay', val);
    updateRelayUI(val === 1);
    if (S.db) update(ref(S.db, `${S.fbPath}/Relay`), { value: val });
    log(`Relay manual → ${val === 1 ? 'ON' : 'OFF'}`);
};

async function connectBLE() {
    try {
        log("Mencari Micro:bit...", "#4a90e2");
        S.device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: "BBC micro:bit" }], optionalServices: [SVC] });
        const server = await S.device.gatt.connect();
        const service = await server.getPrimaryService(SVC);
        S.rxChar = await service.getCharacteristic(RX);
        const txChar = await service.getCharacteristic(TX);
        await txChar.startNotifications();
        txChar.addEventListener("characteristicvaluechanged", e => {
            S.bleBuffer += new TextDecoder().decode(e.target.value);
            const lines = S.bleBuffer.split('\n');
            S.bleBuffer = lines.pop() || '';
            lines.forEach(line => handleIncoming(line.trim()));
        });
        $('status-bt').innerText = "BT Online";
        $('status-bt').classList.add('online');
        $('btn-connect-ble').style.display = 'none';
        $('btn-disconnect-ble').style.display = 'block';
        log("BLE Connected!", "green");
    } catch (e) { log("BLE Error: " + e.message, "red"); }
}

function handleIncoming(txt) {
    if (!txt || !txt.includes(':')) return;
    const [key, val] = txt.split(':');
    const num = parseFloat(val);

    if (key === "jarak") {
        $('val-jarak').innerHTML = `${num}<span class="sensor-unit">cm</span>`;
        pushToChart("jarak", num);
    }
    if (key === "jarak_manual") {
        $('val-jarak-manual').innerHTML = `${num}<span class="sensor-unit">cm</span>`;
        pushToChart("jarak_manual", num);
    }
    if (key === "Relay") updateRelayUI(num === 1);
    if (key === "mode") {
        S.mode = (num === 1) ? 'auto' : 'manual';
        updateModeUI();
    }
    if (S.db) update(ref(S.db, `${S.fbPath}/${key}`), { value: num }).catch(()=>{});
}

async function sendBLE(key, val) {
    if (!S.rxChar) return;
    try {
        await S.rxChar.writeValue(new TextEncoder().encode(`${key}:${val}\n`));
        log(`TX → ${key}:${val}`, "#555");
    } catch (e) { log("TX Error", "red"); }
}

async function connectFirebase() {
    const apiKey = $('fb-apiKey').value.trim();
    const databaseURL = $('fb-dbUrl').value.trim();
    const path = $('fb-path').value.trim() || S.fbPath;
    if (!apiKey || !databaseURL) return alert("Lengkapi data Firebase!");
    try {
        if (getApps().length) await deleteApp(getApps()[0]);
        const app = initializeApp({ apiKey, databaseURL });
        S.db = getDatabase(app);
        S.fbPath = path;
        onValue(ref(S.db, path), snap => {
            const d = snap.val(); if (!d) return;
            if (d.jarak) $('val-jarak').innerHTML = `${d.jarak.value}<span class="sensor-unit">cm</span>`;
            if (d.jarak_manual) $('val-jarak-manual').innerHTML = `${d.jarak_manual.value}<span class="sensor-unit">cm</span>`;
            if (d.Relay !== undefined) updateRelayUI(d.Relay.value === 1);
            if (d.mode !== undefined) { S.mode = (d.mode.value === 1) ? 'auto' : 'manual'; updateModeUI(); }
        });
        $('status-fb').innerText = "FB Online";
        $('status-fb').classList.add('online');
        log("Firebase Linked!", "green");
    } catch (e) { log("Firebase Error", "red"); }
}

$('mode-auto').onclick = () => { S.mode = 'auto'; updateModeUI(); sendBLE("mode", 1); };
$('mode-manual').onclick = () => { S.mode = 'manual'; updateModeUI(); sendBLE("mode", 0); };
$('btn-connect-ble').onclick = connectBLE;
$('btn-disconnect-ble').onclick = () => { if(S.device) S.device.gatt.disconnect(); };
$('btn-connect-fb').onclick = connectFirebase;
$('btnClearLog').onclick = () => $('terminalLog').innerHTML = '';

initCharts();
updateModeUI();
log("Super Tripro System Ready 🌱");
</script>
</body>
</html>
